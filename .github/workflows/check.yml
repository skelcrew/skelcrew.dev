name: Check

# Vercel builds and deploys the site, with a preview for every pull request.
# This runs the full check (lint, typecheck, build) so a broken change shows up on the PR.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
